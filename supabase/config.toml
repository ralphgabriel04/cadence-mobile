[project]
id = ""

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# Story 2.1: password minimum is 8 characters (local stack; the hosted project is a Ralph gesture).
minimum_password_length = 8
# Deep link of the app. Recovery emails must come back to cadence://reset-password.
# The localhost entries let the same flow be tested on Expo web (local stack only).
site_url = "cadence://"
additional_redirect_urls = ["cadence://reset-password", "http://localhost:8081/reset-password", "http://localhost:8081"]

[auth.email]
# Local stack only: ask new accounts to confirm their address (story 2.1, criterion 1).
# The hosted project's setting is a Ralph gesture; it is never changed from here.
enable_confirmations = true

[auth.email.template.recovery]
subject = "Réinitialise ton mot de passe Cadence"
content_path = "./supabase/templates/recovery.html"

# Story 2.6 (c): the email code used by the web deletion page. The app has no
# passwordless login, so the "magic link" template is only used by that page.
[auth.email.template.magic_link]
subject = "Ton code de confirmation Cadence"
content_path = "./supabase/templates/deletion-code.html"
